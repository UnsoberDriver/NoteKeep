<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion – NoteKeep</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#C97A4A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%92%A1</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #f7f3ee;
    --card:   #ffffff;
    --ink:    #2c2c2c;
    --muted:  #888;
    --accent: #C97A4A;
    --border: #e0d8d0;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:    #1a1a1a;
      --card:  #252525;
      --ink:   #e8e4df;
      --muted: #888;
      --border:#333;
    }
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 40px 36px 32px;
    width: 100%;
    max-width: 400px;
  }

  .logo {
    font-size: 36px;
    text-align: center;
    margin-bottom: 8px;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 28px;
    color: var(--ink);
  }

  /* ── Bouton Google ── */
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 11px 16px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s, border-color .15s, box-shadow .15s;
    margin-bottom: 20px;
  }
  .btn-google:hover {
    background: var(--bg);
    border-color: #bbb;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .btn-google svg { flex-shrink: 0; }

  /* ── Séparateur ── */
  .sep {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    color: var(--muted);
    font-size: 13px;
  }
  .sep::before, .sep::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Formulaire classique ── */
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 5px;
    color: var(--muted);
  }
  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    outline: none;
    transition: border-color .15s;
    margin-bottom: 14px;
  }
  input:focus { border-color: var(--accent); }

  .btn-primary {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-primary:hover { opacity: .88; }

  .footer-link {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
  }
  .footer-link a { color: var(--accent); text-decoration: none; }
  .footer-link a:hover { text-decoration: underline; }

  /* ── Messages d'erreur / info ── */
  .alert {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 18px;
  }
  .alert-error { background: #fdecea; color: #c0392b; border: 1px solid #f5c6c2; }
  .alert-info  { background: #e8f4fd; color: #1a6ea8; border: 1px solid #bee3f8; }
  @media (prefers-color-scheme: dark) {
    .alert-error { background: #3a1a1a; color: #ff7f7f; border-color: #5a2a2a; }
    .alert-info  { background: #1a2a3a; color: #7fbfff; border-color: #2a4a6a; }
  }

  /* ── Tabs (Connexion / Inscription) ── */
  .tabs {
    display: flex;
    border-bottom: 1.5px solid var(--border);
    margin-bottom: 24px;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    position: relative;
    transition: color .15s;
  }
  .tab-btn.active {
    color: var(--accent);
  }
  .tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    border-radius: 2px;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">💡</div>
  <h1>NoteKeep</h1>

  <!-- Message d'erreur / info depuis l'URL -->
  <div id="alertBox" style="display:none" class="alert"></div>

  <!-- ── Bouton Google (commun aux deux modes) ── -->
  <a href="/google-oauth" class="btn-google">
    <!-- Logo Google SVG officiel -->
    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/>
      <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/>
      <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/>
      <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z" fill="#EA4335"/>
    </svg>
    Continuer avec Google
  </a>

  <div class="sep">ou</div>

  <!-- ── Onglets ── -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="login">Connexion</button>
    <button class="tab-btn" data-tab="register">Inscription</button>
  </div>

  <!-- ── Panneau Connexion ── -->
  <div class="tab-panel active" id="tab-login">
    <label for="login-email">E-mail ou nom d'utilisateur</label>
    <input type="text" id="login-email" autocomplete="username" placeholder="vous@exemple.com">

    <label for="login-password">Mot de passe</label>
    <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••">

    <button class="btn-primary" id="btnLogin">Se connecter</button>
  </div>

  <!-- ── Panneau Inscription ── -->
  <div class="tab-panel" id="tab-register">
    <label for="reg-username">Nom d'utilisateur</label>
    <input type="text" id="reg-username" autocomplete="username" placeholder="ex : jean_dupont">

    <label for="reg-email">E-mail</label>
    <input type="email" id="reg-email" autocomplete="email" placeholder="vous@exemple.com">

    <label for="reg-password">Mot de passe</label>
    <input type="password" id="reg-password" autocomplete="new-password" placeholder="8 caractères minimum">

    <button class="btn-primary" id="btnRegister">Créer mon compte</button>
  </div>

  <!-- ── Panneau récupération (compte Google, nouvel appareil) ──
       Affiché uniquement quand une session Google valide existe déjà
       côté serveur mais qu'aucune clé privée n'est présente sur cet
       appareil : il n'y a pas de mot de passe pour un compte Google,
       seule la recovery key permet de déverrouiller les notes. -->
  <div class="tab-panel" id="tab-recovery" style="display:none">
    <p style="font-size:14px; color:var(--muted); margin-bottom:14px;">
      Ce compte est connecté avec Google et n'a pas de mot de passe.
      Entrez votre clé de récupération (affichée lors de la première
      connexion) pour déverrouiller vos notes sur cet appareil.
    </p>
    <label for="recovery-key">Clé de récupération</label>
    <input type="text" id="recovery-key" autocomplete="off" placeholder="XXXX-XXXX-XXXX-...">

    <button class="btn-primary" id="btnRecovery">Déverrouiller</button>
  </div>
</div>

<script>
// ── Affiche le message d'erreur/info depuis l'URL (?error=... ou ?info=...)
(function () {
  const p = new URLSearchParams(location.search);
  const box = document.getElementById('alertBox');
  if (p.has('error')) {
    box.textContent = p.get('error');
    box.className = 'alert alert-error';
    box.style.display = 'block';
  } else if (p.has('info')) {
    box.textContent = p.get('info');
    box.className = 'alert alert-info';
    box.style.display = 'block';
  }
})();

// ── Onglets
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    document.getElementById('alertBox').style.display = 'none';
  });
});
let csrfToken = null;
async function getCsrfToken() {
  if (csrfToken) return csrfToken;
  const res = await fetch('/user/auth.php?action=csrf_token', { credentials: 'same-origin' });
  const data = await res.json();
  csrfToken = data.token;
  return csrfToken;
}

// ── Connexion classique
document.getElementById('btnLogin').addEventListener('click', async () => {
  const identifier = document.getElementById('login-email').value.trim();
  const password   = document.getElementById('login-password').value;
  if (!identifier || !password) return showError('Remplissez tous les champs.');
  const token = await getCsrfToken();
  const res = await fetch('/user/auth.php?action=login', {
    method: 'POST',
	credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': token },
    body: JSON.stringify({ identifier, password }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    return showError(data.error || 'Identifiants incorrects.');
  }

  try {
    const { unwrapPrivateKeyWithPassword, toB64 } = await import('/crypto.js');
    const { privateKeyRaw } = await unwrapPrivateKeyWithPassword(
      password, data.e2ee.kdf_salt, data.e2ee.enc_private_key_pwd
    );
    localStorage.setItem('e2ee_priv', toB64(privateKeyRaw));
  } catch (e) {
    console.error('Erreur déverrouillage clé E2EE:', e);
    return showError('Mot de passe correct, mais impossible de déchiffrer vos données. Contactez le support.');
  }

  window.location.href = '/';
});

// ── Inscription classique
document.getElementById('btnRegister').addEventListener('click', async () => {
  const username = document.getElementById('reg-username').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  if (!username || !email || !password) return showError('Remplissez tous les champs.');
  if (password.length < 8) return showError('Le mot de passe doit faire au moins 8 caractères.');

  let payload;
  try {
    const { generateIdentityKeyPair, wrapPrivateKey } = await import('/crypto.js');
    const identity = await generateIdentityKeyPair();
    const wrapped = await wrapPrivateKey(identity.privateKeyRaw, password);

    payload = {
      username, email, password,
      public_key: identity.publicKeyB64,
      kdf_salt: wrapped.salt,
      kdf_iterations: wrapped.kdf_iterations,
      enc_private_key_pwd: wrapped.enc_private_key_pwd,
      enc_private_key_recovery: wrapped.enc_private_key_recovery,
    };
    window.__pendingRecoveryDisplay = wrapped.recoveryKeyDisplay;
    window.__pendingPrivateKeyRaw = identity.privateKeyRaw;
  } catch (e) {
    console.error('Erreur génération des clés E2EE:', e);
    return showError('Erreur lors de la préparation du chiffrement. Réessayez.');
  }
  const token = await getCsrfToken();
  const res = await fetch('/user/auth.php?action=register', {
    method: 'POST',
	credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': token },
    body: JSON.stringify(payload),
  });
  const data = await res.json().catch(() => ({}));
  if (res.ok) {
    const { toB64 } = await import('/crypto.js');
    localStorage.setItem('e2ee_priv', toB64(window.__pendingPrivateKeyRaw));
    showRecoveryKeyOnce(window.__pendingRecoveryDisplay); // non-bloquant
    window.location.href = '/';
  } else {
    showError(data.error || 'Erreur lors de l\'inscription.');
  }
});

function showRecoveryKeyOnce(display) {
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.innerHTML = `
    <div style="background:#1c1c1c;border-radius:12px;padding:28px;max-width:440px;color:#eee;font-family:sans-serif;">
      <h2 style="margin-top:0;">Votre clé de récupération</h2>
      <p>Notez cette clé et gardez-la en lieu sûr : elle permet de récupérer vos notes si vous oubliez votre mot de passe. Elle ne sera plus jamais affichée.</p>
      <code style="display:block;background:#000;padding:12px;border-radius:6px;font-size:1.1em;letter-spacing:1px;word-break:break-all;margin:16px 0;">${display}</code>
      <button id="recoveryOk" style="width:100%;padding:10px;border:none;border-radius:6px;background:#C97A4A;color:#fff;font-weight:bold;cursor:pointer;">J'ai noté ma clé</button>
    </div>
  `;
  document.body.appendChild(modal);
  return new Promise(resolve => {
    modal.querySelector('#recoveryOk').addEventListener('click', () => { modal.remove(); resolve(); });
  });
}

// ── Soumission au clavier (Enter)
['login-password', 'reg-password'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const btn = id.startsWith('login') ? 'btnLogin' : 'btnRegister';
      document.getElementById(btn).click();
    }
  });
});

function showError(msg) {
  const box = document.getElementById('alertBox');
  box.textContent = msg;
  box.className = 'alert alert-error';
  box.style.display = 'block';
}

// ── Compte Google déjà connecté côté serveur, mais aucune clé locale ──
// (nouvel appareil, ou localStorage vidé). Bascule l'écran sur la saisie
// de la recovery key au lieu des onglets Connexion/Inscription.
function showRecoveryPanel() {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector('.tabs').style.display = 'none';
  document.querySelector('.sep').style.display = 'none';
  document.getElementById('tab-recovery').style.display = 'block';
  document.getElementById('tab-recovery').classList.add('active');
}

(async function checkExistingGoogleSession() {
  try {
    const meRes = await fetch('/user/auth.php?action=me', { credentials: 'same-origin'});
    if (!meRes.ok) return; // pas de session : écran de connexion normal

    // Une clé privée est déjà présente sur cet appareil : rien à faire,
    // index.php la retrouvera dans localStorage.
    if (localStorage.getItem('e2ee_priv')) {
      window.location.href = '/';
      return;
    }

    const statusRes = await fetch('/user/auth.php?action=e2ee_status', { credentials: 'same-origin' });
    if (!statusRes.ok) return;
    const status = await statusRes.json();

    if (!status.e2ee_configured) {
      // Pas encore d'E2EE configuré (ex : tout premier login Google) :
      // index.php se charge de l'amorçage automatique.
      window.location.href = '/';
      return;
    }

    if (!status.has_password && status.enc_private_key_recovery) {
      // Compte Google-only : seule la recovery key permet de déverrouiller.
      window.__pendingE2eeStatus = status;
      showRecoveryPanel();
    }
    // Compte avec mot de passe, session valide mais pas de clé locale
    // (nouvel appareil) : on NE redirige PAS vers '/', sinon index.php
    // renvoie aussitôt vers /login (boucle infinie). On laisse
    // l'utilisateur se reconnecter normalement via le formulaire, ce qui
    // déverrouillera sa clé avec son mot de passe (voir btnLogin).
  } catch (e) {
    // Pas de session ou erreur réseau : on laisse l'écran de connexion normal.
  }
})();

document.getElementById('btnRecovery').addEventListener('click', async () => {
  const display = document.getElementById('recovery-key').value.trim();
  if (!display) return showError('Entrez votre clé de récupération.');

  const status = window.__pendingE2eeStatus;
  if (!status || !status.enc_private_key_recovery) {
    return showError('Erreur : informations de récupération indisponibles.');
  }

  try {
    const { unwrapPrivateKeyWithRecovery, toB64 } = await import('/crypto.js');
    const { privateKeyRaw } = await unwrapPrivateKeyWithRecovery(display, status.enc_private_key_recovery);
    localStorage.setItem('e2ee_priv', toB64(privateKeyRaw));
    window.location.href = '/';
  } catch (e) {
    console.error('Échec du déverrouillage:', e);
    showError('Clé de récupération invalide.');
  }
});
</script>
</body>
</html>
